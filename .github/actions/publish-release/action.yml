name: Publish release
description: Create the GitHub release with every changelog section since the last published release, then upload its assets

inputs:
  tag:
    description: Release tag (vMAJOR.MINOR.PATCH)
    required: true
  version:
    description: Version the tag carries (MAJOR.MINOR.PATCH)
    required: true
  target:
    description: Commit the tag points at when the release is created
    required: true
  assets:
    description: Files to upload, one per line
    required: true
  changelog:
    description: Changelog with one "## [version]" heading per cut
    required: false
    default: CHANGELOG.md
  token:
    description: Token with contents:write
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Create the release and upload the assets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
        VER: ${{ inputs.version }}
        TARGET: ${{ inputs.target }}
        CHANGELOG: ${{ inputs.changelog }}
        ASSETS: ${{ inputs.assets }}
      run: bash "$GITHUB_ACTION_PATH/publish.sh"
