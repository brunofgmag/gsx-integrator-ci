name: Setup environment
description: Install Qt (MSVC 2022 x64) and optionally provision the MSFS SDK

inputs:
  install-qt:
    description: Install Qt
    required: false
    default: 'true'
  qt-version:
    description: Qt version
    required: false
    default: '6.8.3'
  qt-modules:
    description: Extra Qt modules (space-separated)
    required: false
    default: ''
  sdk-url:
    description: MSFS SDK URL
    required: false
    default: ''
  sdk-sha256:
    description: SDK SHA256
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Qt
      if: inputs.install-qt == 'true'
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
      with:
        version: ${{ inputs.qt-version }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: ${{ inputs.qt-modules }}
        cache: true

    - name: Resolve MSFS SDK cache key
      if: inputs.sdk-url != '' && inputs.sdk-sha256 != ''
      id: sdk-cache
      shell: pwsh
      env:
        MSFS_SDK_SHA256: ${{ inputs.sdk-sha256 }}
      run: |
        $normalised = $env:MSFS_SDK_SHA256.Trim().ToLowerInvariant()
        $stream = [System.IO.MemoryStream]::new([System.Text.Encoding]::UTF8.GetBytes($normalised))
        $key = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash.Substring(0, 16).ToLowerInvariant()
        "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Cache MSFS SDK archive
      if: inputs.sdk-url != '' && inputs.sdk-sha256 != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/msfs-sdk-cache
        key: msfs-sdk-${{ runner.os }}-${{ steps.sdk-cache.outputs.key }}

    - name: Provision MSFS SDK
      if: inputs.sdk-url != ''
      shell: pwsh
      env:
        MSFS_SDK_URL: ${{ inputs.sdk-url }}
        MSFS_SDK_SHA256: ${{ inputs.sdk-sha256 }}
        MSFS_SDK_CACHE_DIR: ${{ inputs.sdk-sha256 != '' && format('{0}/msfs-sdk-cache', runner.temp) || '' }}
      run: |
        if ($env:MSFS_SDK_SHA256) {
          ./tools/setup-msfs-sdk.ps1 -Url $env:MSFS_SDK_URL -Sha256 $env:MSFS_SDK_SHA256
        } else {
          ./tools/setup-msfs-sdk.ps1 -Url $env:MSFS_SDK_URL
        }
