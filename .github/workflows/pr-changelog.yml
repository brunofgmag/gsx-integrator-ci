name: PR Changelog

on:
  workflow_call:

jobs:
  commit-override:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Build the block
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          subjects="$(gh api "repos/$GH_REPO/pulls/$NUMBER/commits" --paginate \
            --jq '.[] | "\(.commit.message | split("\n")[0]) ([\(.sha[0:7])](\($ENV.SERVER)/\($ENV.GH_REPO)/commit/\(.sha)))"' \
            | grep -vE '^(Merge|Revert) ' || true)"

          if [ -z "$subjects" ]; then
            echo "::error::pull request $NUMBER has no commit subject to list"
            exit 1
          fi

          type="$(printf '%s' "$TITLE" | sed -E 's/^([a-z]+)(\([^)]*\))?!?: .*/\1/')"
          head="$(printf '%s' "$TITLE" | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//')"
          case "$type" in
            feat|feature|fix|perf|revert) lead="pr: $head (#$NUMBER)" ;;
            *) lead="$TITLE (#$NUMBER)" ;;
          esac
          spaced="$(printf '%s\n' "$subjects" | awk 'NF { if (n++) print ""; print }')"

          {
            echo 'block<<FSORG_BLOCK_EOF'
            printf 'BEGIN_COMMIT_OVERRIDE\n%s\n\n%s\nEND_COMMIT_OVERRIDE\n' \
              "$lead" "$spaced"
            echo 'FSORG_BLOCK_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Put it in the body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BLOCK: ${{ steps.build.outputs.block }}
        run: |
          gh pr view "$NUMBER" --json body --jq .body | tr -d '\r' > body.txt

          awk '/^BEGIN_COMMIT_OVERRIDE$/ { skip = 1 }
               !skip { print }
               /^END_COMMIT_OVERRIDE$/ { skip = 0 }' body.txt \
            | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba' > prose.txt

          if [ -s prose.txt ]; then
            printf '%s\n\n%s' "$(cat prose.txt)" "$BLOCK" > wanted.txt
          else
            printf '%s' "$BLOCK" > wanted.txt
          fi

          if diff -q body.txt wanted.txt >/dev/null 2>&1; then
            echo "the block is already current"
            exit 0
          fi

          gh pr edit "$NUMBER" --body-file wanted.txt
          echo "the block was written into pull request $NUMBER"
