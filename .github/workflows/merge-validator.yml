name: Merge Validator

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner image
        type: string
        default: windows-2022
      install-qt:
        description: Install Qt via setup-build-env
        type: boolean
        default: true
      qt-version:
        description: Qt version, shared by the Windows and Linux jobs
        type: string
        default: '6.8.3'
      qt-modules:
        description: Extra Qt modules (space-separated)
        type: string
        default: ''
      domain-tests:
        description: Build and test the portable layers on Linux; needs the tests-only CMake option named by tests-only-flag
        type: boolean
        default: false
      run-tests:
        description: Pass -RunTests to build.ps1
        type: boolean
        default: true
      no-sim:
        description: Pass -NoSim to build.ps1; needs the build.ps1 of the calling repository to declare that switch
        type: boolean
        default: false
      allow-forks:
        description: Run the full build for fork PRs (only safe when no secrets are needed)
        type: boolean
        default: false
      fork-tests-only:
        description: Run a tests-only build for fork PRs; needs the tests-only CMake option named by tests-only-flag
        type: boolean
        default: false
      tests-only-flag:
        description: CMake option that configures the tests-only build, as the calling repository names it
        type: string
        default: GSXI_TESTS_ONLY

jobs:
  full-validation:
    name: Build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.pull_request.head.ref, 'release-please--') &&
       (inputs.allow-forks ||
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check this repository takes -NoSim
        if: inputs.no-sim
        shell: pwsh
        run: |
          if (-not (Select-String -Path build.ps1 -Pattern '\$NoSim' -Quiet))
          {
              throw 'no-sim was asked for, but the build.ps1 of this repository declares no -NoSim switch.'
          }

      - name: Setup environment
        uses: brunofgmag/gsx-integrator-ci/.github/actions/setup-build-env@main
        with:
          install-qt: ${{ inputs.install-qt }}
          qt-version: ${{ inputs.qt-version }}
          qt-modules: ${{ inputs.qt-modules }}
          sdk-url: ${{ secrets.MSFS_SDK_URL }}
          sdk-sha256: ${{ secrets.MSFS_SDK_SHA256 }}

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Config Release ${{ inputs.run-tests && '-RunTests' || '' }} ${{ inputs.no-sim && '-NoSim' || '' }}

  domain-validation:
    name: Build (Linux, tests only)
    if: >-
      inputs.domain-tests &&
      (github.event_name == 'workflow_dispatch' ||
       !startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check this repository configures the tests-only build
        shell: bash
        env:
          FLAG: ${{ inputs.tests-only-flag }}
        run: |
          if ! grep -rqs -- "$FLAG" CMakeLists.txt cmake; then
            echo "::error::$FLAG is not an option of this repository, so the tests-only build cannot be configured."
            exit 1
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ inputs.qt-version }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build/tests-only
          -D${{ inputs.tests-only-flag }}=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/tests-only --parallel 2

      - name: Test
        run: ctest --test-dir build/tests-only --output-on-failure

  fork-validation:
    name: Build (tests only)
    if: >-
      inputs.fork-tests-only &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check this repository configures the tests-only build
        shell: bash
        env:
          FLAG: ${{ inputs.tests-only-flag }}
        run: |
          if ! grep -rqs -- "$FLAG" CMakeLists.txt cmake; then
            echo "::error::$FLAG is not an option of this repository, so the tests-only build cannot be configured."
            exit 1
          fi

      - name: Setup environment
        uses: brunofgmag/gsx-integrator-ci/.github/actions/setup-build-env@main
        with:
          qt-modules: ${{ inputs.qt-modules }}

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build/tests-only
          -G "Visual Studio 17 2022" -A x64
          -D${{ inputs.tests-only-flag }}=ON
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build tests
        shell: pwsh
        run: cmake --build build/tests-only --config Release

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/tests-only -C Release --output-on-failure
